<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>图标对照预览 · 文件管理 vs 产物</title>
<style>
  :root { --bg:#17191c; --panel:#1f2226; --panel2:#26292e; --border:#33373d; --text:#e6e8ea; --dim:#8b9198; --accent:#3fb6a8; --user:#4fc26a; --hover:#2b2f34; --shadow:rgba(0,0,0,.35); }
  html.light { --bg:#eef0f2; --panel:#ffffff; --panel2:#e6e9ec; --border:#d2d6da; --text:#1c1f22; --dim:#6b7278; --accent:#0f9488; --user:#2f9e4f; --hover:#f3f5f7; --shadow:rgba(0,0,0,.1); }
  * { box-sizing: border-box; }
  body { margin:0; padding:26px 30px 40px; background:var(--bg); color:var(--text);
         font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  h1 { font-size:16px; margin:0 0 4px; }
  .sub { font-size:12px; color:var(--dim); margin-bottom:18px; }
  .sub code { background:var(--panel2); padding:1px 5px; border-radius:4px; }
  .tools { position:fixed; top:16px; right:20px; }
  .tools button { background:var(--text); color:var(--bg); border:0; border-radius:7px; padding:6px 12px;
                  font-size:12px; cursor:pointer; }
  .cols { display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; }
  .col { flex:1 1 380px; min-width:330px; background:var(--panel); border:1px solid var(--border);
         border-radius:12px; overflow:hidden; box-shadow:0 3px 14px var(--shadow); }
  .col > h2 { font-size:12.5px; margin:0; padding:11px 14px; color:var(--dim); font-weight:600;
              background:linear-gradient(to bottom, var(--panel2), color-mix(in srgb, var(--panel2) 40%, var(--panel))); }
  .pad { padding:8px; }

  /* 文件管理：与 web/index.html 的 .fm-item 一致 */
  .fm-item { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:8px;
             cursor:pointer; font-size:12.5px; color:var(--text); }
  .fm-item:hover { background:var(--panel); }
  .fm-item > svg { flex-shrink:0; }
  .fm-item .fnm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fm-item .fmeta { font-size:10.5px; color:var(--dim); flex-shrink:0; }

  /* 产物区：与 web/index.html 的 .artifacts 一致 */
  .artifacts { border:1px solid color-mix(in srgb, var(--border) 60%, transparent); border-radius:12px;
               overflow:hidden; background:var(--panel2); }
  .artifacts .art-title { display:flex; align-items:center; gap:7px; padding:9px 12px; font-size:12px;
                          color:var(--dim); background:var(--panel2);
                          border-bottom:1px solid color-mix(in srgb, var(--border) 55%, transparent); }
  .artifacts .art-title .cnt { margin-left:auto; font-size:10.5px; }
  .artifacts .art-item { display:flex; align-items:center; gap:8px; padding:6px 10px; font-size:12px;
                         cursor:pointer; background:var(--panel); }
  .artifacts .art-item + .art-item { border-top:1px solid color-mix(in srgb, var(--border) 55%, transparent); }
  .artifacts .art-item:hover { background:var(--hover); }
  .artifacts .art-item .aico { display:flex; align-items:center; flex-shrink:0; }
  .artifacts .art-item .anm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
                              font-family:Consolas,monospace; font-size:11.5px; }
  .artifacts .art-item .atag { margin-left:auto; font-size:10.5px; color:var(--dim); flex-shrink:0; }
  .artifacts .art-item .atag.new { color:var(--accent); }
  .artifacts .art-item .atag.edit { color:var(--user); }
  .artifacts .art-item .adl { flex-shrink:0; color:var(--dim); display:flex; align-items:center;
                              padding:3px; border-radius:5px; }
  .artifacts .art-item .adl:hover { color:var(--accent); background:var(--panel); }
</style></head>
<body>
  <div class="tools"><button id="tg">切换主题</button></div>
  <h1>图标对照预览：文件管理 vs 产物</h1>
  <div class="sub">两侧图标均调用 <code>web/index.html</code> 中同一个 <code>fmIcon(name, isDir)</code>，输出字符串级相同。</div>
  <div class="cols">
    <div class="col"><h2>文件管理（#fmList）</h2><div class="pad" id="fm"></div></div>
    <div class="col"><h2>产物（消息末尾 .artifacts）</h2><div class="pad" id="art"></div></div>
  </div>
<script>
const FM_FOLDER_PATH = '<path d="M1.8 4.2c0-.77.62-1.4 1.4-1.4h3l1.5 1.7h5.1c.78 0 1.4.63 1.4 1.4v6.9c0 .78-.62 1.4-1.4 1.4H3.2a1.4 1.4 0 01-1.4-1.4V4.2z" fill="#f6c356"/>'
// 文件形状（右上留角）+ 类型色填充，缩写在正中
const FM_FILE_SHAPE = (color) => `<path d="M3.4 1.6h5.3l4 4v8.2c0 .66-.54 1.2-1.2 1.2H3.4a1.2 1.2 0 01-1.2-1.2V2.8c0-.66.54-1.2 1.2-1.2z" fill="${color}"/><path d="M8.7 1.6l4 4H8.7z" fill="rgba(255,255,255,.35)"/>`
const FM_BADGES = {
  py: ["PY", "#3572A5"], js: ["JS", "#c9a227"], mjs: ["JS", "#c9a227"], cjs: ["JS", "#c9a227"],
  ts: ["TS", "#3178c6"], tsx: ["TS", "#3178c6"], jsx: ["JS", "#c9a227"],
  md: ["MD", "#4a89b8"], markdown: ["MD", "#4a89b8"],
  css: ["CSS", "#2965f1"], scss: ["CSS", "#c6538c"], less: ["CSS", "#2965f1"],
  json: ["{}", "#b0a021"], jsonc: ["{}", "#b0a021"],
  yml: ["YML", "#6a737d"], yaml: ["YML", "#6a737d"], toml: ["TML", "#8a919c"],
  ini: ["INI", "#8a919c"], cfg: ["CFG", "#8a919c"], conf: ["CFG", "#8a919c"], env: ["ENV", "#8a919c"],
  go: ["GO", "#00add8"], rs: ["RS", "#b07219"], java: ["JA", "#b07219"], rb: ["RB", "#cc342d"],
  php: ["PHP", "#777bb4"], cs: ["C#", "#68217a"], c: ["C", "#5a6b7a"], h: ["H", "#5a6b7a"],
  cpp: ["C+", "#5a6b7a"], hpp: ["H", "#5a6b7a"], sql: ["SQL", "#e38c00"], vue: ["VUE", "#41b883"],
  sh: ["SH", "#4fc26a"], bat: ["BAT", "#4fc26a"], cmd: ["BAT", "#4fc26a"], ps1: ["PS1", "#2b6cb0"],
  doc: ["W", "#2b579a"], docx: ["W", "#2b579a"], xls: ["X", "#1d6f42"], xlsx: ["X", "#1d6f42"],
  ppt: ["P", "#d24726"], pptx: ["P", "#d24726"], pdf: ["PDF", "#e05252"], rtf: ["RTF", "#8a919c"],
}
const FM_GLYPHS = {
  img: '<rect x="1.8" y="2.6" width="12.4" height="10.8" rx="2" stroke="currentColor" stroke-width="1.3"/><circle cx="5.6" cy="6.4" r="1.2" fill="currentColor"/><path d="M2.6 11.6l3.4-3.2 2.4 2.2 2.2-2 3 2.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>',
  table: '<rect x="1.8" y="2.6" width="12.4" height="10.8" rx="1.8" stroke="currentColor" stroke-width="1.3"/><path d="M1.8 6.4h12.4M6.4 6.4v7M10.6 6.4v7" stroke="currentColor" stroke-width="1.2"/>',
  term: '<rect x="1.8" y="2.6" width="12.4" height="10.8" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M4.6 6.2l1.8 1.8-1.8 1.8M8.4 10h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>',
  zip: '<path d="M1.8 4.4L8 1.8l6.2 2.6v7.2L8 14.2l-6.2-2.6z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 1.8v12.4M8 5.2h2.2M5.8 7.4H8M8 9.6h2.2" stroke="currentColor" stroke-width="1.1"/>',
  lines: '<path d="M3.4 1.6h5.3l4 4v8.2c0 .66-.54 1.2-1.2 1.2H3.4a1.2 1.2 0 01-1.2-1.2V2.8c0-.66.54-1.2 1.2-1.2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M4.6 7.4h6M4.6 9.8h6M4.6 12h3.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>',
  code: '<path d="M5.6 5.2L2.4 8l3.2 2.8M10.4 5.2L13.6 8l-3.2 2.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>',
  file: '<path d="M3.4 1.6h5.3l4 4v8.2c0 .66-.54 1.2-1.2 1.2H3.4a1.2 1.2 0 01-1.2-1.2V2.8c0-.66.54-1.2 1.2-1.2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8.7 1.6l4 4H8.7z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>',
}
const FM_EXT_GROUP = {
  png: "img", jpg: "img", jpeg: "img", gif: "img", webp: "img", bmp: "img", svg: "img", ico: "img", avif: "img",
  csv: "table", tsv: "table",
  zip: "zip", rar: "zip", "7z": "zip", tar: "zip", gz: "zip", bz2: "zip", xz: "zip",
  txt: "lines", log: "lines", text: "lines", lock: "lines", gitignore: "lines", editorconfig: "lines",
  html: "code", htm: "code", xml: "code", vue2: "code",
}
const FM_GLYPH_COLOR = { html: "#e34c26", htm: "#e34c26", xml: "#8a919c", img: "#a074c4", table: "#2da44e", zip: "#c09553", term: "#4fc26a", lines: "#8a919c" }

function fmIcon(name, isDir) {
  if (isDir) return `<svg width="15" height="15" viewBox="0 0 16 16" fill="none">${FM_FOLDER_PATH}</svg>`
  const ext = (name.match(/\.([^.\\/]+)$/)?.[1] ?? "").toLowerCase()
  const badge = FM_BADGES[ext]
  if (badge) {
    const label = badge[0]
    const fs = label.length >= 3 ? 5 : label.length === 2 ? 6.2 : 7
    return `<svg width="15" height="15" viewBox="0 0 16 16" fill="none">${FM_FILE_SHAPE(badge[1])}<text x="8" y="${label.length >= 3 ? 10.4 : 10.8}" font-size="${fs}" font-family="Segoe UI,sans-serif" font-weight="700" fill="#fff" text-anchor="middle">${label}</text></svg>`
  }
  const g = FM_EXT_GROUP[ext] ?? (ext ? "file" : "file")
  const color = FM_GLYPH_COLOR[g] ?? "var(--dim)"
  return `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" style="color:${color}">${FM_GLYPHS[g] ?? FM_GLYPHS.file}</svg>`
}

const ART_ICON = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="1.8" y="2.5" width="12.4" height="8.2" rx="1.2" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 13.5h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M6.2 5.2l2 2-2 2M9.2 9.2h1.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
const DL_ICON = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M8 2v8m0 0l3-3m-3 3L5 7M2.5 12.5h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
const FILES = [["src",true],["web",true],["AGENT-WHITEPAPER.md",false],["gateway.ts",false],["tools.py",false],["index.html",false],["styles.css",false],["package.json",false],["config.yml",false],["app.js",false],["view.tsx",false],["logo.png",false],["data.xlsx",false],["docs.pdf",false],["notes.txt",false],["archive.zip",false],["run.sh",false],["main.go",false],["lib.rs",false],["unknown.xyzzy",false],["Makefile",false]]
const TAGS = ["new","edit",""]

const fmEl = document.getElementById('fm')
fmEl.innerHTML = FILES.map(([n, d]) =>
  '<div class="fm-item" data-dir="' + (d ? 1 : 0) + '">' + fmIcon(n, d) +
  '<span class="fnm">' + n + '</span>' +
  '<span class="fmeta">' + (d ? '文件夹' : (n.split('.').pop() || '—')) + '</span></div>').join('')

const artEl = document.getElementById('art')
const rows = FILES.filter(([, d]) => !d)
artEl.innerHTML = '<div class="artifacts">' +
  '<div class="art-title">' + ART_ICON + '<span>产物</span><span class="cnt">' + rows.length + ' 个文件 · 点击预览</span></div>' +
  rows.map(([n], i) => { const tag = TAGS[i % 3]
    return '<div class="art-item"><span class="aico">' + fmIcon(n) + '</span>' +
      '<span class="anm">' + n + '</span>' +
      (tag ? '<span class="atag ' + tag + '">' + (tag === 'new' ? '新建' : '已修改') + '</span>' : '<span class="atag">输出</span>') +
      '<span class="adl">' + DL_ICON + '</span></div>' }).join('') +
  '</div>'

document.getElementById('tg').onclick = () =>
  document.documentElement.classList.toggle('light')
</script>
</body></html>
